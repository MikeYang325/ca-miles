name: Refresh airline cabin tables

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query official Air China cabin tables
        run: node scripts/refresh-airline-cabins.mjs
      - name: Commit changed official data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add airline-cabins.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh airline cabin tables"
          git push
