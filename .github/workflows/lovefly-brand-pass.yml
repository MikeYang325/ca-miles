name: LoveFly brand pass
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply brand signature
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html')
          text = html.read_text()
          if '<a class="lovefly-signature"' not in text:
              needle = '      <div><h1>凤凰知音里程计算</h1><p>只调用凤凰知音官方累计接口</p></div>'
              repl = '      <div><a class="lovefly-signature" href="https://lovefly.club/" aria-label="返回 LoveFly.club"><span class="lf-love">Love</span><span class="lf-fly">Fly</span><span class="lf-dot">.</span><span class="lf-club">club</span></a><h1>凤凰知音里程计算</h1><p>只调用凤凰知音官方累计接口</p></div>'
              if needle not in text:
                  raise SystemExit('ca header not found')
              html.write_text(text.replace(needle, repl, 1))
          css = Path('theme.css')
          c = css.read_text()
          if 'LoveFly family signature' not in c:
              c += '''\n\n/* LoveFly family signature */\n.lovefly-signature{display:inline-flex;align-items:baseline;margin:8px 0 1px;color:#333;text-decoration:none;white-space:nowrap;line-height:1}\n.lovefly-signature .lf-love{font:italic 16px/1 Georgia,"Times New Roman",serif;letter-spacing:-.05em}\n.lovefly-signature .lf-fly{margin-left:1px;font:700 15px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.055em}\n.lovefly-signature .lf-dot{margin-left:1px;color:#e52323;font:800 15px/1 Georgia,serif}\n.lovefly-signature .lf-club{margin-left:2px;color:#777;font:500 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace}\n.lovefly-signature:hover .lf-fly{color:#e52323}\n@media(max-width:720px){.lovefly-signature{margin-top:7px}.lovefly-signature .lf-love{font-size:14px}.lovefly-signature .lf-fly,.lovefly-signature .lf-dot{font-size:13px}.lovefly-signature .lf-club{font-size:8px}}\n'''
              css.write_text(c)
          PY
          rm .github/workflows/lovefly-brand-pass.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html theme.css .github/workflows/lovefly-brand-pass.yml
          git commit -m "Add LoveFly family signature"
          git push
