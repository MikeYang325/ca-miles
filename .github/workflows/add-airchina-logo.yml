name: Add Air China logo
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add local Air China wordmark
        run: |
          set -euo pipefail
          curl -L --fail --retry 2 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Air_China_wordmark.svg' -o air-china-wordmark.svg
          grep -qi '<svg' air-china-wordmark.svg
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<header class="topbar">\n      <div><a class="lovefly-signature"'
          new='<header class="topbar">\n      <div class="carrier-heading"><img class="carrier-logo carrier-logo--airchina" src="/air-china-wordmark.svg" alt="中国国际航空 Air China" /><div><a class="lovefly-signature"'
          if old not in s: raise SystemExit('topbar marker missing')
          s=s.replace(old,new,1)
          old2='<p>只调用凤凰知音官方累计接口</p></div>\n      <a href="https://ffp.airchina.com.cn/'
          new2='<p>只调用凤凰知音官方累计接口</p></div></div>\n      <a href="https://ffp.airchina.com.cn/'
          if old2 not in s: raise SystemExit('topbar close marker missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          css=Path('lovefly-tools.css')
          c=css.read_text()
          add='''\n.carrier-heading{display:flex;align-items:center;gap:16px}.carrier-logo{display:block;flex:0 0 auto;width:auto;max-width:116px;height:34px;object-fit:contain;object-position:left center}.carrier-logo--airchina{width:112px;height:auto}@media(max-width:720px){.carrier-heading{gap:10px}.carrier-logo{max-width:84px;height:28px}.carrier-logo--airchina{width:84px;height:auto}}\n'''
          if '.carrier-heading{' not in c: css.write_text(c+add)
          PY
          rm .github/workflows/add-airchina-logo.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html lovefly-tools.css air-china-wordmark.svg .github/workflows/add-airchina-logo.yml
          git commit -m 'Show Air China logo in mileage header'
          git push
