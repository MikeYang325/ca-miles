name: Deploy EdgeOne

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy existing EdgeOne project
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${EDGEONE_API_TOKEN:?EDGEONE_API_TOKEN is missing}"
          API='https://pages-api.edgeone.ai/v1'
          DOMAIN='ca-miles.lovefly.club'
          projects="$(curl -fsS "$API" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
            --data-binary '{"Action":"DescribePagesProjects","Limit":100,"Offset":0}')"
          test "$(echo "$projects" | jq -r '.Code')" = 0
          project_name="$(echo "$projects" | jq -r --arg d "$DOMAIN" '.Data.Response.Projects[] | select(any(.CustomDomains[]?; .Domain==$d)) | .Name' | head -1)"
          test "$project_name" = 'ca-miles-new'
          project_id="$(echo "$projects" | jq -r --arg n "$project_name" '.Data.Response.Projects[] | select(.Name==$n) | .ProjectId' | head -1)"
          project_provider="$(echo "$projects" | jq -r --arg n "$project_name" '.Data.Response.Projects[] | select(.Name==$n) | .Provider' | head -1)"
          test -n "$project_id"
          test "$project_provider" = 'Github'
          deployment_payload="$(jq -nc \
            --arg project_id "$project_id" \
            --arg commit "${GITHUB_SHA}" \
            --arg message "${GITHUB_EVENT_HEAD_COMMIT_MESSAGE:-Deploy from GitHub Actions}" \
            '{Action:"CreatePagesDeployment",ProjectId:$project_id,ViaMeta:"Github",Env:"Production",Provider:"Github",RepoBranch:"main",RepoCommitHash:$commit,RepoCommitMsg:$message}')"
          deployment="$(curl -fsS "$API" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer ${EDGEONE_API_TOKEN}" \
            --data-binary "$deployment_payload")"
          test "$(echo "$deployment" | jq -r '.Code')" = 0
          echo "edgeone_deployment_id=$(echo "$deployment" | jq -r '.Data.Response.DeploymentId // .Data.DeploymentId // "unknown"')"

      - name: Verify production build and A3 mileage API
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            if curl -fsS --max-time 20 'https://ca-miles.lovefly.club/' -o /tmp/ca-miles.html \
              && grep -q 'https://ffp.airchina.com.cn/img/lg.png' /tmp/ca-miles.html \
              && grep -q '第一步：选择常旅客计划' /tmp/ca-miles.html \
              && grep -q 'Miles+Bonus（A3）' /tmp/ca-miles.html \
              && grep -q 'program-rules.json' /tmp/ca-miles.html \
              && grep -q 'targetProgram' /tmp/ca-miles.html \
              && grep -q 'date-control' /tmp/ca-miles.html \
              && grep -q 'class="cabin"' /tmp/ca-miles.html \
              && curl -fsS --max-time 20 'https://ca-miles.lovefly.club/airports.json' -o /tmp/ca-miles-airports.json \
              && jq -e 'length >= 300 and any(.[]; .code == "PEK")' /tmp/ca-miles-airports.json >/dev/null \
              && curl -fsS --max-time 20 'https://ca-miles.lovefly.club/program-rules.json' -o /tmp/ca-miles-program-rules.json \
              && jq -e '.programs.A3.partners.CA.rules | length == 10' /tmp/ca-miles-program-rules.json >/dev/null; then
              a3_result="$(curl -sS --max-time 20 'https://ca-miles.lovefly.club/api/airchina/mileage' \
                -H 'Content-Type: application/json' \
                --data '{"targetProgram":"A3","memberGrade":"Normal","segments":[{"flightDate":"2026-09-15","flightNo":"CA183","origin":"PEK","destination":"SHA","cabin":"C"}]}' || true)"
              if echo "$a3_result" | grep -q '"targetProgram":"A3"' \
                && echo "$a3_result" | grep -q '"availableMileage":1631'; then
                echo 'CA_MILES_A3_DEPLOYMENT=PASS'
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'production partner-airline verification failed' >&2
          exit 1
