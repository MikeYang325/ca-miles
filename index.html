<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/png" href="/airchina-phoenix-favicon.png?v=20260831-clean-2">
  <meta name="lovefly-release" content="20260831-partner-airlines-2">
  <title>凤凰知音里程计算</title>
  <link rel="stylesheet" href="theme.css?v=20260831-date-picker-1">
  <link rel="stylesheet" href="/lovefly-tools.css?v=20260831-airchina-logo-7">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="carrier-heading"><div class="brand-lockup"><a href="https://ffp.airchina.com.cn/" target="_blank" rel="noreferrer" aria-label="Phoenix Miles 官网"><img class="brand-logo brand-logo--phoenix" src="https://ffp.airchina.com.cn/img/lg.png" alt="Phoenix Miles" /></a><span class="brand-join" aria-hidden="true">×</span><a href="https://lovefly.club/" target="_blank" rel="noreferrer" aria-label="LoveFly.club 官网"><img class="brand-logo brand-logo--lovefly" src="/lovefly-wordmark.svg" alt="LoveFly.club" /></a></div><div><h1>凤凰知音里程计算</h1><p>只调用国航官方累计接口</p></div></div>
      <a href="https://ffp.airchina.com.cn/plan/mileage_accumulate_calculator.html" target="_blank" rel="noreferrer">官方规则 <span aria-hidden="true">↗︎</span></a>
    </header>

    <form id="calculator" novalidate>
      <section class="sheet" aria-labelledby="trip-title">
        <div class="section-title">
          <div><h2 id="trip-title">航段</h2><p>选择日期、机场与舱位；外航请填写实际承运航司两字码和航班号</p></div>
          <label class="roundtrip-toggle"><input id="roundtrip" type="checkbox"><span aria-hidden="true"></span>往返</label>
        </div>
        <div class="segment-head" aria-hidden="true"><span></span><span class="required-head">日期</span><span class="flight-head"><i>航司</i><i>航班号（可选）</i></span><span class="required-head">起点</span><span></span><span class="required-head">终点</span><span class="required-head">舱位</span><span></span></div>
        <div id="segments" class="segments"></div>
        <div class="segment-actions">
          <button id="add-segment" class="text-button" type="button">＋ 添加航段</button>
          <p id="return-note" hidden>已反转机场；请填写返程日期和航班号</p>
        </div>
      </section>

      <section class="settings" aria-label="计算设置">
        <label><span>凤凰知音卡等</span><select id="member-grade"><option value="Normal">普通卡</option><option value="Junior">儿童卡</option><option value="Silver">银卡</option><option value="Gold">金卡</option><option value="Platinum">白金卡</option><option value="LifetimePlatinum">终身白金卡</option></select></label>
        <label><span>全程含税价格</span><div class="price-field"><b>¥</b><input id="price" type="number" min="0" step="0.01" inputmode="decimal"></div></label>
        <div class="form-actions"><button id="calculate" class="primary-button" type="submit">查询并计算</button><button id="reset" class="reset-button" type="button">重置</button></div>
      </section>
    </form>

    <section id="result" class="result" aria-live="polite" hidden>
      <div class="result-summary">
        <div><span>可用里程</span><strong id="total-miles">0</strong></div>
        <div><span>定级里程</span><strong id="status-miles">0</strong></div>
        <div class="yield-summary"><span>每 1 元获得可用里程</span><strong><span id="miles-per-yuan">—</span><small> 里程 / 元</small></strong><em id="miles-per-yuan-formula">填写价格后显示计算式</em></div>
      </div>
      <div id="breakdown" class="breakdown"></div>
      <div id="official-tiers" class="official-tiers"></div>
    </section>
    <p id="status" class="status" role="status"></p>
    <footer>结果直接取自国航凤凰知音 <code>mileageCumulateCalculation</code>。外航请填写实际承运航司两字码和航班号；航班号留空时查询该航司的通用规则。结果只用于里程测算，最终入账以国航为准。</footer>
  </main>

  <template id="segment-template">
    <article class="segment">
      <span class="segment-number"></span>
      <label><span>日期</span><div class="date-field"><button class="date-control" type="button" aria-haspopup="dialog" aria-expanded="false"><span class="date-display">请选择日期</span><span class="date-icon" aria-hidden="true"></span></button><input class="flight-date" type="hidden" required><div class="date-picker" hidden role="dialog" aria-label="选择日期"></div></div></label>
      <label><span>航司 / 航班号（可选）</span><div class="flight-field"><span class="flight-subhead airline-subhead">航司</span><span class="flight-subhead number-subhead">航班号（可选）</span><div class="airline-field"><select class="airline" aria-label="航司两字码"><optgroup label="国航系"><option value="CA">CA · 中国国际航空</option><option value="ZH">ZH · 深圳航空</option><option value="SC">SC · 山东航空</option><option value="TV">TV · 西藏航空</option><option value="NX">NX · 澳门航空</option><option value="KY">KY · 昆明航空</option></optgroup><optgroup label="星空联盟"><option value="NZ">NZ · 新西兰航空</option><option value="LH">LH · 汉莎航空</option><option value="TG">TG · 泰国航空</option><option value="AC">AC · 加拿大航空</option><option value="TP">TP · 葡萄牙航空</option><option value="MS">MS · 埃及航空</option><option value="AI">AI · 印度航空</option><option value="LO">LO · 波兰航空</option><option value="SQ">SQ · 新加坡航空</option><option value="BR">BR · 长荣航空</option><option value="OU">OU · 克罗地亚航空</option><option value="UA">UA · 美国联合航空</option><option value="NH">NH · 全日空航空</option><option value="ET">ET · 埃塞俄比亚航空</option><option value="AV">AV · 哥伦比亚航空</option><option value="OS">OS · 奥地利航空</option><option value="A3">A3 · 爱琴海航空</option><option value="OZ">OZ · 韩亚航空</option><option value="CM">CM · 巴拿马航空</option><option value="LX">LX · 瑞士国际航空</option><option value="SN">SN · 布鲁塞尔航空</option><option value="SA">SA · 南非航空</option><option value="TK">TK · 土耳其航空</option></optgroup><optgroup label="星盟优连及其他"><option value="JP">JP · 亚德里亚航空</option><option value="O6">O6 · 哥伦比亚巴西航空</option><option value="TA">TA · TACA</option><option value="LR">LR · 哥伦比亚航空</option><option value="T0">T0 · 其他合作伙伴</option><option value="2K">2K · 哥伦比亚航空</option><option value="CX">CX · 国泰航空</option><option value="B7">B7 · 立荣航空</option><option value="HO">HO · 吉祥航空</option><option value="VL">VL · 汉莎城市航空</option><option value="AZ">AZ · 意大利航空</option></optgroup></select></div><input class="flight-number" type="text" maxlength="5" inputmode="numeric" autocomplete="off"></div></label>
      <label class="airport-field"><span>起点</span><input class="origin" type="text" maxlength="40" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" required><div class="airport-suggestions" role="listbox" hidden></div></label>
      <span class="arrow" aria-hidden="true">→</span>
      <label class="airport-field"><span>终点</span><input class="destination" type="text" maxlength="40" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" required><div class="airport-suggestions" role="listbox" hidden></div></label>
      <label class="cabin-field"><span>舱位</span><select class="cabin" required disabled><option value=""></option></select></label>
      <button class="remove" type="button" aria-label="删除航段">删除</button>
    </article>
  </template>
  <script>
    const $=(selector,root=document)=>root.querySelector(selector),segmentsEl=$('#segments'),template=$('#segment-template'),roundtripEl=$('#roundtrip'),statusEl=$('#status'),resultEl=$('#result'),calculateButton=$('#calculate'),API_BASE=location.protocol==='file:'?'http://127.0.0.1:8766':'',API_URL=`${API_BASE}/api/airchina/mileage`,TIERS_URL=`${API_BASE}/api/airchina/tiers`,AIRPORTS_URL=`${API_BASE}/api/airchina/airports?v=20260821-zag`,AIRPORTS_DB_URL='airports.json',AIRLINE_CABINS_DB_URL='airline-cabins.json';
    let nextId=1,openDateField=null;
    let airports=[],airportsReady=false,airportLoadError='',airlineCabins={},airlineCabinsReady=false,tierCache=new Map();
    function todayString(){const value=new Date();value.setMinutes(value.getMinutes()-value.getTimezoneOffset());return value.toISOString().slice(0,10)}
    function dateLabel(value){const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return match?`${match[1]}年${match[2]}月${match[3]}日`:''}
    function setDate(input,value){input.value=/^\d{4}-\d{2}-\d{2}$/.test(String(value||''))?value:'';const field=input.parentElement,label=dateLabel(input.value)||'请选择日期';field.querySelector('.date-display').textContent=label;field.querySelector('.date-control').setAttribute('aria-label',`日期 ${label}`)}
    function cabinPrompt(segment){const select=$('.cabin',segment);select.innerHTML='<option value=""></option>';select.value='';select.disabled=true}
    function applyCabinOptions(segment,tiers,prior=''){const select=$('.cabin',segment),choices=tiers.flatMap(tier=>tier.subClassName.split('/').map(code=>({code,rate:tier.rate})));select.innerHTML='<option value=""></option>'+choices.map(item=>`<option value="${item.code}">${item.code} · ${item.rate}</option>`).join('');select.disabled=!choices.length;if(choices.some(item=>item.code===prior))select.value=prior}
    function cabinKey(segment){return JSON.stringify({flightDate:$('.flight-date',segment).value,flightNo:fullFlightNo(segment),origin:resolveAirportCode($('.origin',segment)),destination:resolveAirportCode($('.destination',segment)),memberGrade:$('#member-grade').value})}
    function refreshCabinOptions(segment){const airline=$('.airline',segment).value,prior=$('.cabin',segment).value||segment.dataset.requestedCabin||'';if(airlineCabinsReady&&Object.prototype.hasOwnProperty.call(airlineCabins,airline))applyCabinOptions(segment,airlineCabins[airline],prior);else cabinPrompt(segment)}
    function scheduleCabinRefresh(segment){clearTimeout(segment._cabinTimer);segment._cabinTimer=setTimeout(()=>refreshCabinOptions(segment),260)}
    function dateParts(value){const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return match?{year:Number(match[1]),month:Number(match[2])-1,day:Number(match[3])}:null}
    function dateValue(year,month,day){return`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
    function renderDatePicker(input,year,month){const field=input.parentElement,picker=field.querySelector('.date-picker'),selected=dateParts(input.value),firstDay=new Date(year,month,1),offset=(firstDay.getDay()+6)%7,totalDays=new Date(year,month+1,0).getDate(),previousDays=new Date(year,month,0).getDate(),cells=[];for(let index=0;index<42;index+=1){const dayIndex=index-offset+1,day=dayIndex<1?previousDays+dayIndex:dayIndex>totalDays?dayIndex-totalDays:dayIndex,cellMonth=dayIndex<1?month-1:dayIndex>totalDays?month+1:month,cellYear=cellMonth<0?year-1:cellMonth>11?year+1:year,value=dateValue(cellYear,(cellMonth+12)%12,day),outside=cellYear!==year||cellMonth!==month,isSelected=selected?.year===cellYear&&selected.month===((cellMonth+12)%12)&&selected.day===day;cells.push(`<button class="date-day${outside?' is-outside':''}${isSelected?' is-selected':''}" type="button" data-date="${value}"${isSelected?' aria-current="date"':''}>${day}</button>`)}picker.dataset.viewYear=String(year);picker.dataset.viewMonth=String(month);picker.innerHTML=`<div class="date-picker-head"><strong>${year}年${String(month+1).padStart(2,'0')}月</strong><div><button class="date-nav" type="button" data-date-nav="-1" aria-label="上个月">‹</button><button class="date-nav" type="button" data-date-nav="1" aria-label="下个月">›</button></div></div><div class="date-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="date-days">${cells.join('')}</div><div class="date-picker-foot"><button class="date-today" type="button">今天</button></div>`}
    function closeDatePicker(){if(!openDateField)return;openDateField.querySelector('.date-picker').hidden=true;openDateField.querySelector('.date-control').setAttribute('aria-expanded','false');openDateField=null}
    function openDatePicker(control){const field=control.parentElement,input=field.querySelector('.flight-date'),current=dateParts(input.value)||dateParts(todayString());if(openDateField&&openDateField!==field)closeDatePicker();openDateField=field;renderDatePicker(input,current.year,current.month);field.querySelector('.date-picker').hidden=false;control.setAttribute('aria-expanded','true')}
    function chooseDate(input,value){setDate(input,value);input.dispatchEvent(new Event('change',{bubbles:true}));closeDatePicker()}
    function normalizeInput(input){input.value=input.value.toUpperCase().replace(/\s+/g,'')}
    function selectOnFocus(event){if(event.target.matches('input:not([type="checkbox"]):not([type="date"])'))event.target.select()}
    function addSegment(values={}){const fragment=template.content.cloneNode(true),segment=$('.segment',fragment),match=String(values.flightNo||'').match(/^([A-Z]{2})(.*)$/);segment.dataset.id=String(nextId++);segment.dataset.role=values.role||'outbound';if(values.pairId)segment.dataset.pairId=values.pairId;setDate($('.flight-date',segment),values.flightDate===undefined?todayString():values.flightDate);$('.airline',segment).value=match?.[1]||values.airline||'CA';$('.flight-number',segment).value=match?.[2]||values.flightNumber||'';$('.origin',segment).value=values.origin||'';$('.destination',segment).value=values.destination||'';if(segment.dataset.role==='return'){$('.origin',segment).readOnly=true;$('.destination',segment).readOnly=true}segmentsEl.append(segment);refreshSegments();if(values.cabin)segment.dataset.requestedCabin=values.cabin;scheduleCabinRefresh(segment);return segment}
    function fullFlightNo(segment,fallback=true){const airline=$('.airline',segment).value,number=$('.flight-number',segment).value.toUpperCase().replace(/\s+/g,'');return`${airline}${number||(fallback?'0':'')}`}
    function rebuildReturns(){const saved=new Map([...segmentsEl.querySelectorAll('[data-role="return"]')].map(item=>[item.dataset.pairId,{flightDate:$('.flight-date',item).value,flightNo:fullFlightNo(item,false),cabin:$('.cabin',item).value}]));segmentsEl.querySelectorAll('[data-role="return"]').forEach(item=>item.remove());if(!roundtripEl.checked){refreshSegments();return}const outbound=[...segmentsEl.querySelectorAll('[data-role="outbound"]')];outbound.slice().reverse().forEach(item=>{const pairId=item.dataset.pairId||`pair-${item.dataset.id}`,prior=saved.get(pairId)||{};item.dataset.pairId=pairId;addSegment({role:'return',pairId,flightDate:prior.flightDate??'',flightNo:prior.flightNo||'',airline:$('.airline',item).value,origin:$('.destination',item).value,destination:$('.origin',item).value,cabin:prior.cabin||$('.cabin',item).value})});refreshSegments()}
    function nameFields(item,prefix){[['.flight-date','日期'],['.airline','航司'],['.flight-number','航班号'],['.origin','起点'],['.destination','终点'],['.cabin','舱位']].forEach(([selector,name])=>$(selector,item).setAttribute('aria-label',`${prefix} ${name}`))}
    function refreshSegments(){const items=[...segmentsEl.children],outbound=items.filter(item=>item.dataset.role==='outbound'),returns=items.filter(item=>item.dataset.role==='return');outbound.forEach((item,index)=>{const prefix=`去程 ${index+1}`;$('.segment-number',item).textContent=`去${index+1}`;$('.remove',item).disabled=outbound.length===1;nameFields(item,prefix)});returns.forEach((item,index)=>{const prefix=`返程 ${index+1}`;$('.segment-number',item).textContent=`返${index+1}`;$('.remove',item).hidden=true;nameFields(item,prefix)})}
    async function loadAirports(){try{const [officialResult,localResult]=await Promise.allSettled([fetch(AIRPORTS_URL).then(async response=>{const data=await response.json();if(!response.ok||!data.success||!Array.isArray(data.airports))throw new Error(data.message||'国航机场数据加载失败');return data.airports}),fetch(AIRPORTS_DB_URL).then(async response=>{const data=await response.json();if(!response.ok||!Array.isArray(data))throw new Error('本地机场数据库加载失败');return data})]),merged=new Map();if(localResult.status==='fulfilled')localResult.value.forEach(item=>merged.set(item.code,item));if(officialResult.status==='fulfilled')officialResult.value.forEach(item=>merged.set(item.code,item));airports=[...merged.values()];if(!airports.length)throw new Error('机场数据加载失败');airportsReady=true;airportLoadError=''}catch(error){airportsReady=false;airportLoadError=error.message||'机场数据加载失败'}const active=document.activeElement;if(active?.matches?.('.origin,.destination')&&active.value)renderAirportList(active)}
    async function loadCabinCatalog(){try{const response=await fetch(AIRLINE_CABINS_DB_URL,{cache:'no-store'}),data=await response.json();if(!response.ok||!data.airlines||typeof data.airlines!=='object')throw new Error('官网舱位缓存格式异常');airlineCabins=data.airlines;airlineCabinsReady=true;[...segmentsEl.children].forEach(refreshCabinOptions)}catch(error){airlineCabinsReady=false;[...segmentsEl.children].forEach(segment=>cabinPrompt(segment,'官网舱位表加载失败，请稍后重试'))}}
    function airportMatches(value){const query=value.trim().toLowerCase();if(!query)return[];const matches=airports.filter(item=>item.code.toLowerCase().startsWith(query)||item.name.toLowerCase().includes(query)||item.city.toLowerCase().includes(query)||item.pinyin.toLowerCase().startsWith(query)||item.initials.toLowerCase().startsWith(query)).sort((a,b)=>{const exactA=a.code.toLowerCase()===query?0:a.code.toLowerCase().startsWith(query)?1:a.name.toLowerCase().startsWith(query)||a.city.toLowerCase().startsWith(query)?2:3;const exactB=b.code.toLowerCase()===query?0:b.code.toLowerCase().startsWith(query)?1:b.name.toLowerCase().startsWith(query)||b.city.toLowerCase().startsWith(query)?2:3;return exactA-exactB}).slice(0,8);const code=query.toUpperCase();if(/^[A-Z]{3}$/.test(code)&&!matches.some(item=>item.code===code))matches.unshift({name:'直接使用三字码',pinyin:'静态机场表尚未收录',code,initials:'',city:''});return matches.slice(0,8)}
    function airportByCode(code){return airports.find(item=>item.code===code)||{name:'直接使用三字码',pinyin:'静态机场表尚未收录',code,initials:'',city:''}}
    function closeAirportList(input){const list=input.parentElement.querySelector('.airport-suggestions');list.hidden=true;list.innerHTML='';input.setAttribute('aria-expanded','false');input.removeAttribute('aria-activedescendant');delete input.dataset.activeIndex}
    function syncPairedAirports(segment){if(!roundtripEl.checked||segment?.dataset.role!=='outbound')return;const paired=segmentsEl.querySelector(`[data-role="return"][data-pair-id="${segment.dataset.pairId}"]`);if(paired){$('.origin',paired).value=$('.destination',segment).value;$('.destination',paired).value=$('.origin',segment).value;scheduleCabinRefresh(paired)}}
    function chooseAirport(input,item){input.value=item.code;input.dataset.airportCode=item.code;closeAirportList(input);syncPairedAirports(input.closest('.segment'));input.dispatchEvent(new Event('change',{bubbles:true}))}
    function renderAirportList(input){const list=input.parentElement.querySelector('.airport-suggestions'),matches=airportMatches(input.value);if(!input.value.trim()){closeAirportList(input);return}if(!airportsReady){list.innerHTML=`<div class="airport-empty">${airportLoadError||'国航机场数据正在加载…'}</div>`;list.hidden=false;input.setAttribute('aria-expanded','true');return}if(!matches.length){list.innerHTML='<div class="airport-empty">未找到匹配机场，请继续输入城市、拼音或三字码</div>';list.hidden=false;input.setAttribute('aria-expanded','true');return}const baseId=`airport-${input.closest('.segment').dataset.id}-${input.classList.contains('origin')?'org':'des'}`;list.innerHTML=matches.map((item,index)=>`<button id="${baseId}-${index}" class="airport-option${index===0?' active':''}" type="button" role="option" data-code="${item.code}" aria-label="${item.name} ${item.code}" aria-selected="${index===0}"><span><strong>${item.city||item.name}</strong><small>机场</small></span><b>${item.code}</b></button>`).join('');list.hidden=false;input.setAttribute('aria-expanded','true');input.dataset.activeIndex='0';input.setAttribute('aria-activedescendant',`${baseId}-0`)}
    function moveAirportSelection(input,direction){const list=input.parentElement.querySelector('.airport-suggestions'),options=[...list.querySelectorAll('.airport-option')];if(!options.length)return;let index=Number(input.dataset.activeIndex||0);index=(index+direction+options.length)%options.length;options.forEach((option,i)=>{option.classList.toggle('active',i===index);option.setAttribute('aria-selected',String(i===index))});input.dataset.activeIndex=String(index);input.setAttribute('aria-activedescendant',options[index].id);options[index].scrollIntoView({block:'nearest'})}
    function resolveAirportCode(input){const raw=input.value.trim(),upper=raw.toUpperCase();if(input.dataset.airportCode===upper)return upper;const codeMatch=airports.find(item=>item.code===upper);if(codeMatch)return codeMatch.code;const exact=airports.filter(item=>item.name===raw||item.pinyin.toLowerCase()===raw.toLowerCase()||item.city===raw);if(exact.length===1)return exact[0].code;return/^[A-Z]{3}$/.test(upper)?upper:''}
    function readSegments(){return[...segmentsEl.children].map(segment=>({flightDate:$('.flight-date',segment).value,flightNo:fullFlightNo(segment),origin:resolveAirportCode($('.origin',segment)),destination:resolveAirportCode($('.destination',segment)),cabin:$('.cabin',segment).value.toUpperCase().replace(/\s+/g,'')}))}
    function validateSegments(segments){for(let index=0;index<segments.length;index+=1){const item=segments[index],prefix=`第 ${index+1} 段`;if(!/^\d{4}-\d{2}-\d{2}$/.test(item.flightDate))return`${prefix}请选择日期`;if(!/^[A-Z]{2}\d{1,4}[A-Z]?$/.test(item.flightNo))return`${prefix}的航班号应为两字码 + 1–4 位数字`;if(!/^[A-Z]{3}$/.test(item.origin)||!/^[A-Z]{3}$/.test(item.destination))return`${prefix}请输入或选择有效的机场三字码`;if(item.origin===item.destination)return`${prefix}的起点和终点不能相同`;if(!/^[A-Z]$/.test(item.cabin))return`${prefix}请从国航官方舱位规则中选择舱位`}return''}
    function format(value,digits=0){return new Intl.NumberFormat('zh-CN',{maximumFractionDigits:digits,minimumFractionDigits:digits}).format(value)}
    function formatTierMileage(value){return String(Math.trunc(Number(value)||0))}
    function formatSegments(value){const number=Number(value)||0;return Number.isInteger(number)?String(number):number.toFixed(2)}
    function flightLabel(item){return item.genericRule?`${item.flightNo.slice(0,2)} 通用规则`:item.flightNo}
    function renderTierTable(item,index){const rows=(item.tiers||[]).map(tier=>{const selected=tier.subClassName.split('/').includes(item.cabin);return`<tr${selected?' class="selected-tier"':''}><td>${tier.subClassName}</td><td>${tier.rate}</td><td>${formatTierMileage(tier.availableMileage)}</td><td>${formatTierMileage(tier.gradingMileage)}</td><td>${formatSegments(tier.gradingSegments)}</td></tr>`}).join('');return`<section class="tier-section" aria-labelledby="tier-title-${index}"><div class="tier-heading"><h3 id="tier-title-${index}">航段 ${index+1} · ${item.origin} → ${item.destination}</h3><p>${flightLabel(item)} · 当前选择 ${item.cabin} 舱</p></div><div class="tier-table-wrap" tabindex="0" aria-label="航段 ${index+1} 官方累计档位，可横向滚动"><table class="tier-table"><thead><tr><th>舱位</th><th>里程累积率</th><th>累积可用里程数</th><th>累积定级里程数</th><th>累积定级航段数</th></tr></thead><tbody>${rows}</tbody></table></div></section>`}
    function renderResults(data,price){const availableParts=data.segments.map(item=>format(item.availableMileage)),gradingParts=data.segments.map(item=>format(item.gradingMileage)),equation=(parts,total)=>parts.length>1?`${parts.join(' + ')} = ${format(total)}`:parts[0];$('#total-miles').textContent=format(data.totals.availableMileage);$('#status-miles').textContent=format(data.totals.gradingMileage);$('#miles-per-yuan').textContent=price>0?format(data.totals.availableMileage/price,2):'—';$('#miles-per-yuan-formula').textContent=price>0?`${format(data.totals.availableMileage)} ÷ ¥${format(price,2)} = ${format(data.totals.availableMileage/price,2)}`:'填写价格后显示计算式';$('#breakdown').innerHTML=data.segments.map((item,index)=>`<div class="result-row"><span>${String(index+1).padStart(2,'0')}</span><strong>${item.origin} → ${item.destination}</strong><span>${flightLabel(item)} · ${item.cabin} 舱 · ${item.rate}</span><b>${format(item.availableMileage)}</b></div>`).join('')+`<div class="sum-equations"><p><span>可用里程</span><strong>${equation(availableParts,data.totals.availableMileage)}</strong></p><p><span>定级里程</span><strong>${equation(gradingParts,data.totals.gradingMileage)}</strong></p></div>`;$('#official-tiers').innerHTML=`<h2 class="query-result-title">查询结果：</h2>${data.segments.map(renderTierTable).join('')}`;resultEl.hidden=false;resultEl.scrollIntoView({behavior:'smooth',block:'nearest'})}
    async function calculate(event){event.preventDefault();const segments=readSegments(),error=validateSegments(segments);if(error){statusEl.textContent=error;statusEl.dataset.type='error';return}statusEl.textContent=`正在向国航查询 ${segments.length} 个航段…`;statusEl.dataset.type='loading';resultEl.hidden=true;calculateButton.disabled=true;calculateButton.textContent='查询中…';try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({segments,memberGrade:$('#member-grade').value})}),data=await response.json();if(!response.ok||!data.success)throw new Error(data.message||'国航接口未返回有效数据');renderResults(data,Number($('#price').value)||0);statusEl.textContent=`${data.segments.length} 个航段均已取得国航官方结果`;statusEl.dataset.type='success'}catch(error){statusEl.textContent=error.message;statusEl.dataset.type='error'}finally{calculateButton.disabled=false;calculateButton.textContent='查询并计算'}}
    $('#add-segment').addEventListener('click',()=>{const segment=addSegment();$('.airline',segment).value='';if(roundtripEl.checked)rebuildReturns()});
    segmentsEl.addEventListener('click',event=>{const button=event.target.closest('.remove');if(!button||button.disabled)return;button.closest('.segment').remove();if(roundtripEl.checked)rebuildReturns();else refreshSegments();resultEl.hidden=true;statusEl.textContent='' });
    segmentsEl.addEventListener('focusin',selectOnFocus);
    segmentsEl.addEventListener('mouseup',event=>{if(event.target.matches('input:not([type="checkbox"]):not([type="date"])')){event.preventDefault();event.target.select()}});
    segmentsEl.addEventListener('input',event=>{if(event.target.matches('.flight-number')){normalizeInput(event.target);scheduleCabinRefresh(event.target.closest('.segment'))}if(event.target.matches('.origin,.destination')){delete event.target.dataset.airportCode;renderAirportList(event.target);syncPairedAirports(event.target.closest('.segment'));scheduleCabinRefresh(event.target.closest('.segment'))}});
    segmentsEl.addEventListener('click',event=>{const control=event.target.closest('.date-control');if(control){const field=control.parentElement;if(field.querySelector('.date-picker').hidden)openDatePicker(control);else closeDatePicker();return}const day=event.target.closest('.date-day');if(day&&openDateField){chooseDate(openDateField.querySelector('.flight-date'),day.dataset.date);return}const nav=event.target.closest('[data-date-nav]');if(nav&&openDateField){const picker=openDateField.querySelector('.date-picker'),year=Number(picker.dataset.viewYear),month=Number(picker.dataset.viewMonth)+Number(nav.dataset.dateNav),view=new Date(year,month,1);renderDatePicker(openDateField.querySelector('.flight-date'),view.getFullYear(),view.getMonth());return}if(event.target.closest('.date-today')&&openDateField)chooseDate(openDateField.querySelector('.flight-date'),todayString())});
    segmentsEl.addEventListener('change',event=>{if(event.target.matches('.flight-date')){setDate(event.target,event.target.value);scheduleCabinRefresh(event.target.closest('.segment'))}if(event.target.matches('.origin,.destination'))scheduleCabinRefresh(event.target.closest('.segment'));if(event.target.matches('.airline')){const segment=event.target.closest('.segment'),paired=segmentsEl.querySelector(`[data-role="return"][data-pair-id="${segment.dataset.pairId}"]`);scheduleCabinRefresh(segment);if(paired){$('.airline',paired).value=event.target.value;scheduleCabinRefresh(paired)}}if(event.target.matches('.cabin')){resultEl.hidden=true;statusEl.textContent='' }});
    segmentsEl.addEventListener('keydown',event=>{const input=event.target;if(input.matches('.origin,.destination')){const list=input.parentElement.querySelector('.airport-suggestions');if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();if(list.hidden)renderAirportList(input);else moveAirportSelection(input,event.key==='ArrowDown'?1:-1)}else if(event.key==='Enter'&&!list.hidden){const option=list.querySelector('.airport-option.active');if(option){event.preventDefault();chooseAirport(input,airportByCode(option.dataset.code))}}else if(event.key==='Escape')closeAirportList(input)}});
    segmentsEl.addEventListener('mousedown',event=>{const airportOption=event.target.closest('.airport-option');if(airportOption){event.preventDefault();const input=airportOption.closest('.airport-field').querySelector('input');chooseAirport(input,airportByCode(airportOption.dataset.code))}});
    segmentsEl.addEventListener('focusout',event=>{if(event.target.matches('.origin,.destination'))setTimeout(()=>closeAirportList(event.target),120)});
    roundtripEl.addEventListener('change',()=>{$('#return-note').hidden=!roundtripEl.checked;rebuildReturns()});$('#member-grade').addEventListener('change',()=>segmentsEl.querySelectorAll('.segment').forEach(scheduleCabinRefresh));
    $('#calculator').addEventListener('input',()=>{resultEl.hidden=true;statusEl.textContent=''});
    $('#reset').addEventListener('click',()=>{roundtripEl.checked=false;$('#return-note').hidden=true;segmentsEl.innerHTML='';$('#member-grade').value='Normal';$('#price').value='';resultEl.hidden=true;statusEl.textContent='';const segment=addSegment();$('.airline',segment).value=''});
    document.addEventListener('pointerdown',event=>{if(openDateField&&!openDateField.contains(event.target))closeDatePicker()});document.addEventListener('keydown',event=>{if(event.key==='Escape')closeDatePicker()});$('#calculator').addEventListener('submit',calculate);$('#price').addEventListener('focus',selectOnFocus);const initialSegment=addSegment();$('.airline',initialSegment).value='';loadAirports();loadCabinCatalog();
  </script>
</body>
</html>
